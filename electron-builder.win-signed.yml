# Windows build with code signing (Azure Artifact Signing). Used by `npm run dist:signed`, only when the repository variable
# SIGN_WINDOWS is "true" and the Azure secrets exist (see docs/RELEASE.md). Not exercised yet: no signing account is provisioned.
# `publisherName` also makes the in-app updater check that a downloaded installer is signed by that publisher.
extends: electron-builder.yml
win:
  azureSignOptions:
    endpoint: ${env.AZURE_SIGN_ENDPOINT}
    codeSigningAccountName: ${env.AZURE_SIGN_ACCOUNT}
    certificateProfileName: ${env.AZURE_SIGN_PROFILE}
    publisherName: ${env.WIN_PUBLISHER}
  publisherName:
    - ${env.WIN_PUBLISHER}
