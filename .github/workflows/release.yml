name: Release
# Builds the Windows installer and the macOS dmg/zip for a version tag (v0.2.0, v0.3.0-beta...) and attaches them to a
# GitHub Release. Nothing is signed or notarized: Windows shows SmartScreen and macOS shows Gatekeeper on the first start.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/Arctri-Setup-*.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            release/Arctri-*.dmg
            release/Arctri-*.zip

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Arctri $GITHUB_REF_NAME" --generate-notes $prerelease
