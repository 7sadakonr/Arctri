name: Release
# Builds the Windows installer and the macOS dmg/zip for a version tag (v0.4.0-beta.1, v1.0.0...) and attaches them, with the
# updater metadata (latest.yml, latest-mac.yml, blockmaps), to a GitHub Release.
# Nothing is signed or notarized yet: Windows shows SmartScreen and macOS shows Gatekeeper on the first start, and the macOS
# app does not update itself. A published tag and its binaries are never replaced: a fix is a new, higher version.
# Actions are pinned to a commit (the comment names the tag it was).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The tag is the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: No release exists for this tag yet
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a release for $GITHUB_REF_NAME already exists; publish a new version instead of replacing it"
            exit 1
          fi
      - name: CI passed on this commit
        run: |
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$ok" -lt 1 ]; then
            echo "::error::no successful CI run for $GITHUB_SHA; the release needs the tested commit"
            exit 1
          fi

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      # Signing is switched on by the repository variable SIGN_WINDOWS=true (Azure Artifact Signing: secrets AZURE_TENANT_ID,
      # AZURE_CLIENT_ID, AZURE_CLIENT_SECRET; variables AZURE_SIGN_ENDPOINT, AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE, WIN_PUBLISHER).
      # Until then the installer is unsigned and the release says so. When it is on, a bad signature stops the release.
      - run: npm run dist
        if: vars.SIGN_WINDOWS != 'true'
      - run: npm run dist:signed
        if: vars.SIGN_WINDOWS == 'true'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          WIN_PUBLISHER: ${{ vars.WIN_PUBLISHER }}
      - name: Verify the signature (publisher, timestamp)
        if: vars.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: node scripts/verify-signing.mjs win (Get-ChildItem release/Arctri-Setup-*.exe).FullName --publisher "${{ vars.WIN_PUBLISHER }}"
      - run: node scripts/smoke-installed.mjs --install (Get-ChildItem release/Arctri-Setup-*.exe).FullName
        shell: pwsh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            release/Arctri-Setup-*.exe
            release/Arctri-Setup-*.exe.blockmap
            release/*.yml
            !release/builder-*.yml

  macos:
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      # Developer ID signing and notarization are switched on by the repository variable SIGN_MACOS=true (secrets CSC_LINK,
      # CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER). Until then the app is ad-hoc signed and not notarized, and the
      # in-app update only links to the release page. When it is on, validation of the signature and the notarization ticket must pass.
      - run: npm run dist:mac
        if: vars.SIGN_MACOS != 'true'
      - name: Write the notarization key
        if: vars.SIGN_MACOS == 'true'
        run: |
          echo "${{ secrets.APPLE_API_KEY }}" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - run: npm run dist:mac:signed
        if: vars.SIGN_MACOS == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify signature, hardened runtime and notarization
        if: vars.SIGN_MACOS == 'true'
        run: node scripts/verify-signing.mjs mac release/mac-arm64/Arctri.app release/mac/Arctri.app release/Arctri-*.dmg
      - run: node scripts/smoke-installed.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: |
            release/Arctri-*.dmg
            release/Arctri-*.zip
            release/Arctri-*.blockmap
            release/*.yml
            !release/builder-*.yml

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: The updater metadata matches the files and the tag
        run: node scripts/verify-update-manifest.mjs dist "$GITHUB_REF_NAME"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Arctri $GITHUB_REF_NAME" --generate-notes $prerelease
